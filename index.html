<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Girlfriend's Day ❤️</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#ff758c,#ff7eb3,#ffb6c1);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            overflow:hidden;
        }

        .card{
            background:white;
            width:90%;
            max-width:500px;
            padding:35px;
            border-radius:20px;
            text-align:center;
            box-shadow:0 10px 25px rgba(0,0,0,.25);
            animation:fadeIn 2s ease;
        }

        h1{
            color:#ff3366;
            font-size:2.2rem;
            margin-bottom:15px;
        }

        h2{
            color:#444;
            margin-bottom:20px;
        }

        p{
            color:#666;
            font-size:18px;
            line-height:1.7;
        }

        .heart{
            font-size:60px;
            animation:beat 1s infinite;
            margin:20px 0;
        }

        button{
            margin-top:25px;
            padding:12px 28px;
            border:none;
            border-radius:30px;
            background:#ff3366;
            color:white;
            font-size:18px;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#e6004c;
            transform:scale(1.05);
        }

        @keyframes beat{
            0%{transform:scale(1);}
            50%{transform:scale(1.2);}
            100%{transform:scale(1);}
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(40px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .floating{
            position:absolute;
            color:white;
            font-size:25px;
            animation:float 6s linear infinite;
        }

        @keyframes float{
            from{
                transform:translateY(100vh);
                opacity:1;
            }
            to{
                transform:translateY(-100px);
                opacity:0;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Happy Girlfriend's Day ❤️</h1>
    <h2>To My Beautiful Love</h2>

    <div class="heart">❤️</div>

    <p>
        Happy Girlfriend's Day, my love! ❤️<br><br>
        Thank you for filling my life with happiness,
        laughter, and endless love.
        Every moment with you is my favorite memory.
        I hope today reminds you just how special,
        beautiful, and deeply loved you are.
    </p>

    <button onclick="showMessage()">Click Me ❤️</button>
</div>

<script>
function showMessage(){
    alert("I love you today, tomorrow, and forever. ❤️ Happy Girlfriend's Day!");
}

// Floating hearts
setInterval(() => {
    let heart = document.createElement("div");
    heart.className = "floating";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.fontSize = (20 + Math.random() * 30) + "px";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}, 300);
</script>

</body>
</html>
